<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="PL、SIL 与 ASIL 的适用体系对比">
  <title>PL、SIL、ASIL 对比</title>
  <desc>ISO 13849 的 PL、IEC 62061/61508 的 SIL 与 ISO 26262 的 ASIL 分属不同标准体系。</desc>
  <rect x="20" y="20" width="820" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="52" font-size="18" font-weight="700" fill="#0f172a">三套等级语言：不要混用</text>
  <g font-size="13" fill="#0f172a">
    <rect x="50" y="90" width="230" height="180" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="165" y="120" text-anchor="middle" font-size="16" font-weight="700">PL</text>
    <text x="165" y="146" text-anchor="middle">ISO 13849-1</text>
    <text x="165" y="172" text-anchor="middle">机械安全</text>
    <text x="165" y="198" text-anchor="middle">PL a–e</text>
    <text x="165" y="224" text-anchor="middle">架构、MTTFd、DC</text>
    <text x="165" y="250" text-anchor="middle">验证见 ISO 13849-2</text>
    <rect x="315" y="90" width="230" height="180" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="430" y="120" text-anchor="middle" font-size="16" font-weight="700">SIL</text>
    <text x="430" y="146" text-anchor="middle">IEC 62061 / 61508</text>
    <text x="430" y="172" text-anchor="middle">功能安全</text>
    <text x="430" y="198" text-anchor="middle">SIL 1–4</text>
    <text x="430" y="224" text-anchor="middle">PFH / PFDavg</text>
    <text x="430" y="250" text-anchor="middle">安全生命周期证据</text>
    <rect x="580" y="90" width="230" height="180" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="695" y="120" text-anchor="middle" font-size="16" font-weight="700">ASIL</text>
    <text x="695" y="146" text-anchor="middle">ISO 26262</text>
    <text x="695" y="172" text-anchor="middle">道路车辆</text>
    <text x="695" y="198" text-anchor="middle">ASIL A–D</text>
    <text x="695" y="224" text-anchor="middle">S/E/C 定级</text>
    <text x="695" y="250" text-anchor="middle">硬件与软件证据</text>
  </g>
  <text x="40" y="292" font-size="12" fill="#475569">先确定产品领域和客户要求，再选等级体系；机器人常用 PL 或 SIL，汽车用 ASIL。</text>
</svg>
