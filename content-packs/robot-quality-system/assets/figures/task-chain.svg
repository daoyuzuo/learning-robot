<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="机器人任务链与故障注入点">
  <title>机器人任务链与故障注入点</title>
  <desc>感知、决策、规划、控制、执行五个节点，以及传感器失效、通信降级、动态障碍等注入点。</desc>
  <rect x="20" y="20" width="820" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="52" font-size="18" font-weight="700" fill="#0f172a">任务链测试与故障注入</text>
  <g font-size="13" fill="#0f172a">
    <rect x="60" y="110" width="120" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="120" y="136" text-anchor="middle">感知</text>
    <text x="120" y="154" text-anchor="middle">传感器融合</text>
    <rect x="220" y="110" width="120" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="280" y="136" text-anchor="middle">决策</text>
    <text x="280" y="154" text-anchor="middle">行为选择</text>
    <rect x="380" y="110" width="120" height="60" rx="8" fill="#fae8ff" stroke="#a21caf"/>
    <text x="440" y="136" text-anchor="middle">规划</text>
    <text x="440" y="154" text-anchor="middle">路径与轨迹</text>
    <rect x="540" y="110" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="600" y="136" text-anchor="middle">控制</text>
    <text x="600" y="154" text-anchor="middle">速度与力矩</text>
    <rect x="700" y="110" width="120" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="760" y="136" text-anchor="middle">执行</text>
    <text x="760" y="154" text-anchor="middle">电机与机构</text>
    <line x1="180" y1="140" x2="220" y2="140" stroke="#64748b" stroke-width="2"/>
    <line x1="340" y1="140" x2="380" y2="140" stroke="#64748b" stroke-width="2"/>
    <line x1="500" y1="140" x2="540" y2="140" stroke="#64748b" stroke-width="2"/>
    <line x1="660" y1="140" x2="700" y2="140" stroke="#64748b" stroke-width="2"/>
    <rect x="80" y="210" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="160" y="235" text-anchor="middle">传感器失效 / 噪声</text>
    <rect x="280" y="210" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="360" y="235" text-anchor="middle">动态障碍 / 长尾场景</text>
    <rect x="480" y="210" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="560" y="235" text-anchor="middle">通信延迟 / 丢包</text>
    <rect x="680" y="210" width="140" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="750" y="235" text-anchor="middle">执行器卡滞</text>
  </g>
  <text x="40" y="278" font-size="12" fill="#475569">注入点应沿任务链分布，观察失效如何传播，并验证降级与恢复。</text>
</svg>
