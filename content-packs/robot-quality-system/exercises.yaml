schema: tb/1
exercises:
  - id: EX-001-01
    type: single_choice
    concepts: [test-strategy-inputs]
    level: L2
    prompt: 下列哪一项最直接决定机器人项目的测试深度与范围？
    options:
      - {id: a, text: 需求文档的页数}
      - {id: b, text: 风险等级与失效后果}
      - {id: c, text: 测试团队的人数}
      - {id: d, text: 代码仓库的提交次数}
    answer: b
    explanation: 测试深度应由风险驱动；文档页数、人数和提交次数只是约束或信号，不直接定义范围。
    hints:
      - {level: 1, text: 先问“漏测时后果最严重的是什么”。}
    difficulty: 2

  - id: EX-001-02
    type: short_answer
    concepts: [test-strategy-inputs]
    level: L3
    prompt: 某仓储 AGV 即将改版导航模块。请列出至少 4 类测试策略输入，并说明每一类如何改变测试范围。
    answer:
      accepted: ["需求", "风险", "架构", "变更", "现场", "历史缺陷"]
      min_hits: 3
    rubric:
      - {dimension: 输入完整性, weight: 0.4, criteria: 覆盖需求、风险、架构、变更或现场中的至少 4 类}
      - {dimension: 影响分析, weight: 0.4, criteria: 每类输入都说明了如何改变测试范围}
      - {dimension: 边界, weight: 0.2, criteria: 明确列出本次不测什么及理由}
    difficulty: 3

  - id: EX-002-01
    type: multi_choice
    concepts: [risk-grading]
    level: L2
    prompt: 下列哪些属于机器人测试风险分级的常见维度？
    options:
      - {id: a, text: 安全后果}
      - {id: b, text: 功能失效概率}
      - {id: c, text: 用户体验影响}
      - {id: d, text: 成本与交付影响}
      - {id: e, text: 合规与责任}
      - {id: f, text: 代码缩进风格}
    answer: [a, b, c, d, e]
    explanation: 安全、功能、体验、成本和合规是风险分级的主维度；代码风格不构成失效风险。
    difficulty: 2

  - id: EX-002-02
    type: short_answer
    concepts: [risk-grading]
    level: L3
    prompt: 协作机械臂要在同一工位与人共同作业。请做一次风险分级，并给出测试优先级排序的理由。
    answer:
      accepted: ["安全", "严重度", "暴露", "可控", "功能", "优先级"]
      min_hits: 3
    rubric:
      - {dimension: 维度, weight: 0.4, criteria: 至少使用安全后果、暴露频率、可控性或功能影响中的 3 项}
      - {dimension: 分级, weight: 0.3, criteria: 给出可区分的高中低等级标准}
      - {dimension: 排序, weight: 0.3, criteria: 把分级转化为测试顺序并说明理由}
    difficulty: 3

  - id: EX-003-01
    type: single_choice
    concepts: [test-levels-shift]
    level: L2
    prompt: 下列哪项最典型地属于测试左移活动？
    options:
      - {id: a, text: 上线后监控告警}
      - {id: b, text: 需求评审与静态检查}
      - {id: c, text: 现场故障复盘}
      - {id: d, text: 线上灰度发布}
    answer: b
    explanation: 左移是把发现缺陷的活动提前到需求和编码阶段；监控、灰度和复盘更偏右移或事后活动。
    difficulty: 2

  - id: EX-003-02
    type: short_answer
    concepts: [test-levels-shift]
    level: L3
    prompt: 为一条机器人导航软件设计单元、集成、系统、验收四层测试，并写出每层的进入判据与通过判据。
    answer:
      accepted: ["单元", "集成", "系统", "验收", "判据", "接口"]
      min_hits: 4
    rubric:
      - {dimension: 分层, weight: 0.3, criteria: 四层齐全且职责不重叠}
      - {dimension: 判据, weight: 0.4, criteria: 每层都有可执行的进入与通过判据}
      - {dimension: 左右移, weight: 0.3, criteria: 说明哪些活动提前、哪些监测延后}
    difficulty: 3

  - id: EX-004-01
    type: single_choice
    concepts: [entry-exit-criteria]
    level: L2
    prompt: 判断版本能否准出时，最不应该单独作为依据的是？
    options:
      - {id: a, text: blocker 缺陷是否清零}
      - {id: b, text: 关键需求覆盖是否达标}
      - {id: c, text: 已知问题是否有规避方案}
      - {id: d, text: 代码总行数是否增加}
    answer: d
    explanation: 准出看风险、覆盖、已知问题和回滚能力；代码行数本身不说明质量。
    difficulty: 2

  - id: EX-004-02
    type: short_answer
    concepts: [entry-exit-criteria]
    level: L3
    prompt: 写一份机器人版本准出清单，至少包含 blocker、critical、已知问题、回滚方案和风险接受人。
    answer:
      accepted: ["blocker", "critical", "已知问题", "回滚", "风险接受", "准出"]
      min_hits: 4
    rubric:
      - {dimension: 阻断项, weight: 0.3, criteria: 明确 blocker 与 critical 的判定和清零要求}
      - {dimension: 已知问题, weight: 0.3, criteria: 给出记录、规避和风险接受方式}
      - {dimension: 回滚, weight: 0.4, criteria: 回滚触发条件、步骤和验证都可执行}
    difficulty: 3

  - id: EX-005-01
    type: single_choice
    concepts: [test-design-techniques]
    level: L2
    prompt: 输入范围为 1 到 100 的整数，边界值测试最少应包含哪些取值？
    options:
      - {id: a, text: 1 和 100 两个值}
      - {id: b, text: 0、1、100、101}
      - {id: c, text: "50 一个中间值"}
      - {id: d, text: 1、50、100、101 四个值}
    answer: b
    explanation: 边界值通常取边界内外两侧，即 0、1 和 100、101。
    hints:
      - {level: 1, text: 边界缺陷常出现在“刚好越界”的位置。}
    difficulty: 2

  - id: EX-005-02
    type: short_answer
    concepts: [test-design-techniques]
    level: L3
    prompt: 为“自动泊车入位”功能，分别用等价类、边界值、状态迁移和场景法各设计一条用例，并说明它覆盖的风险。
    answer:
      accepted: ["等价类", "边界", "状态", "场景", "失败", "覆盖"]
      min_hits: 3
    rubric:
      - {dimension: 方法, weight: 0.4, criteria: 四种方法各给出一条可执行用例}
      - {dimension: 覆盖差异, weight: 0.3, criteria: 说明不同方法覆盖的风险差异}
      - {dimension: 预期结果, weight: 0.3, criteria: 每条用例都有可判定的预期结果}
    difficulty: 3

  - id: EX-005-03
    type: multi_choice
    concepts: [test-design-techniques]
    level: L3
    prompt: 下列哪些场景最适合用组合或配对测试来压缩用例？
    options:
      - {id: a, text: 多传感器配置组合}
      - {id: b, text: 单一布尔开关}
      - {id: c, text: 多参数通信超时组合}
      - {id: d, text: 固定路径的单次回归}
    answer: [a, c]
    explanation: 参数多、交互可能产生组合爆炸时适合配对测试；单开关和固定路径不需要。
    difficulty: 3

  - id: EX-006-01
    type: multi_choice
    concepts: [task-chain-fault-injection]
    level: L2
    prompt: 机器人任务链测试通常应覆盖哪些环节？
    options:
      - {id: a, text: 感知}
      - {id: b, text: 决策}
      - {id: c, text: 规划}
      - {id: d, text: 控制}
      - {id: e, text: 执行}
      - {id: f, text: 日志命名}
    answer: [a, b, c, d, e]
    explanation: 任务链从感知到执行；日志命名是工程规范，不是任务链节点。
    difficulty: 2

  - id: EX-006-02
    type: short_answer
    concepts: [task-chain-fault-injection]
    level: L3
    prompt: 针对“动态障碍物突然横穿”设计一组故障注入测试，说明注入点、观测指标、降级预期和恢复判据。
    answer:
      accepted: ["动态障碍", "注入", "传感器", "降级", "判定", "恢复"]
      min_hits: 4
    rubric:
      - {dimension: 注入设计, weight: 0.3, criteria: 明确障碍物出现位置、速度和注入时机}
      - {dimension: 观测指标, weight: 0.3, criteria: 给出可量化的安全与响应指标}
      - {dimension: 降级与恢复, weight: 0.4, criteria: 描述预期降级行为和恢复判据}
    difficulty: 3

  - id: EX-007-01
    type: single_choice
    concepts: [test-oracle-metrics]
    level: L2
    prompt: 没有精确参考模型时，最适合判断“同一输入变换后应产生相应变化”的预言是？
    options:
      - {id: a, text: 规格比对}
      - {id: b, text: 蜕变关系}
      - {id: c, text: 人工目测}
      - {id: d, text: 随机通过}
    answer: b
    explanation: 蜕变测试不要求完整参考模型，只要求输入变换与输出变化之间的关系成立。
    difficulty: 2

  - id: EX-007-02
    type: short_answer
    concepts: [test-oracle-metrics]
    level: L3
    prompt: 为 SLAM 建图定义一个可量化指标，给出阈值、统计口径（单次或 N 次）和失败判定。
    answer:
      accepted: ["指标", "阈值", "P95", "重复", "统计", "误差", "失败"]
      min_hits: 4
    rubric:
      - {dimension: 指标, weight: 0.3, criteria: 指标定义可测量且与任务目标相关}
      - {dimension: 统计口径, weight: 0.4, criteria: 说明重复次数、P95/P99 或 worst-case 的选择}
      - {dimension: 失败判定, weight: 0.3, criteria: 阈值与失败条件明确且可复现}
    difficulty: 3

  - id: EX-008-01
    type: multi_choice
    concepts: [defect-taxonomy]
    level: L2
    prompt: 机器人缺陷分类通常包含哪些类别？
    options:
      - {id: a, text: 需求与设计}
      - {id: b, text: 实现与集成}
      - {id: c, text: 传感器与标定}
      - {id: d, text: 时序与通信}
      - {id: e, text: 安全与合规}
      - {id: f, text: 开发者心情}
    answer: [a, b, c, d, e]
    explanation: 前五类是可直接定位和验证的缺陷来源；开发者心情不是缺陷分类。
    difficulty: 2

  - id: EX-008-02
    type: short_answer
    concepts: [defect-taxonomy]
    level: L3
    prompt: 一条“偶发避障失败”缺陷，请写出复现步骤与证据链要素，使他人能独立复现。
    answer:
      accepted: ["复现", "日志", "时间戳", "环境", "版本", "数据", "传感器"]
      min_hits: 4
    rubric:
      - {dimension: 复现, weight: 0.3, criteria: 步骤、输入和环境足以独立复现}
      - {dimension: 证据, weight: 0.4, criteria: 日志、时间戳、版本、传感器数据和配置齐全}
      - {dimension: 分类, weight: 0.3, criteria: 给出初步缺陷类别和影响范围}
    difficulty: 3

  - id: EX-009-01
    type: single_choice
    concepts: [root-cause-analysis]
    level: L2
    prompt: 5Why 与 FTA 的主要区别是？
    options:
      - {id: a, text: 5Why 是定量方法，FTA 是定性方法}
      - {id: b, text: FTA 从顶事件向下演绎，5Why 逐层追问}
      - {id: c, text: 5Why 只适用于硬件问题}
      - {id: d, text: FTA 完全不需要证据}
    answer: b
    explanation: FTA 从顶事件向下建树，适合分析组合失效；5Why 是线性追问，胜在快速。
    difficulty: 2

  - id: EX-009-02
    type: short_answer
    concepts: [root-cause-analysis]
    level: L3
    prompt: “急停触发后机器人仍移动约 10 cm”反复出现。请给出至少 3 条根因假设及各自的验证方法。
    answer:
      accepted: ["急停", "制动", "延迟", "假设", "验证", "日志", "时序"]
      min_hits: 4
    rubric:
      - {dimension: 假设, weight: 0.4, criteria: 至少 3 条假设覆盖控制、制动、通信或配置}
      - {dimension: 验证, weight: 0.4, criteria: 每条假设都有可执行的验证方法或证据}
      - {dimension: 措施, weight: 0.2, criteria: 给出纠正与预防措施的方向}
    difficulty: 3

  - id: EX-010-01
    type: single_choice
    concepts: [escape-analysis]
    level: L2
    prompt: 逃逸分析要回答的核心问题是？
    options:
      - {id: a, text: 缺陷是谁写的}
      - {id: b, text: 为什么测试没有更早发现}
      - {id: c, text: 一共写了多少用例}
      - {id: d, text: 谁批准了发布}
    answer: b
    explanation: 逃逸分析关注测试与门禁的缺口，而不是追责。
    difficulty: 2

  - id: EX-010-02
    type: short_answer
    concepts: [escape-analysis]
    level: L3
    prompt: 某缺陷在客户现场才暴露。请设计一个从逃逸原因到用例、门禁和回归的改进闭环。
    answer:
      accepted: ["逃逸", "根因", "用例", "门禁", "回归", "复盘"]
      min_hits: 4
    rubric:
      - {dimension: 原因, weight: 0.3, criteria: 区分需求缺口、用例缺口、环境差异或门禁失效}
      - {dimension: 改进, weight: 0.4, criteria: 改进同时覆盖用例、环境和门禁}
      - {dimension: 验证, weight: 0.3, criteria: 说明如何验证改进有效}
    difficulty: 3

  - id: EX-011-01
    type: multi_choice
    concepts: [coverage-model]
    level: L2
    prompt: 机器人项目的覆盖率体系通常应包含哪些类型？
    options:
      - {id: a, text: 需求覆盖}
      - {id: b, text: 场景库覆盖}
      - {id: c, text: 故障模式覆盖}
      - {id: d, text: 接口覆盖}
      - {id: e, text: 仿真到实机覆盖}
      - {id: f, text: 代码注释覆盖}
    answer: [a, b, c, d, e]
    explanation: 机器人需要场景、故障和仿真到实机迁移的覆盖；注释覆盖没有质量意义。
    difficulty: 2

  - id: EX-011-02
    type: short_answer
    concepts: [coverage-model]
    level: L3
    prompt: 为园区配送机器人设计覆盖率目标，至少覆盖需求、场景、接口和故障模式，并说明度量方式。
    answer:
      accepted: ["需求", "场景", "风险", "接口", "故障", "覆盖率", "度量"]
      min_hits: 4
    rubric:
      - {dimension: 维度, weight: 0.4, criteria: 覆盖需求、场景、接口和故障模式中的至少 4 类}
      - {dimension: 目标, weight: 0.3, criteria: 每类都有可量化的目标值}
      - {dimension: 度量, weight: 0.3, criteria: 说明数据来源和统计周期}
    difficulty: 3

  - id: EX-012-01
    type: single_choice
    concepts: [release-gate-regression]
    level: L2
    prompt: 回归测试中的 blocker 缺陷通常指？
    options:
      - {id: a, text: 可以延期修复的缺陷}
      - {id: b, text: 阻塞发布、必须清零的缺陷}
      - {id: c, text: 只影响文档的缺陷}
      - {id: d, text: 只影响性能的缺陷}
    answer: b
    explanation: blocker 阻塞发布；critical 也严重，但是否阻断取决于准出规则。
    difficulty: 2

  - id: EX-012-02
    type: short_answer
    concepts: [release-gate-regression]
    level: L3
    prompt: 导航模块改动后，请写一份回归范围选择与回滚方案，包含影响分析、冒烟集和回滚触发条件。
    answer:
      accepted: ["回归", "影响分析", "blocker", "回滚", "冒烟", "触发"]
      min_hits: 4
    rubric:
      - {dimension: 范围选择, weight: 0.4, criteria: 基于影响分析和风险选择回归范围}
      - {dimension: 冒烟集, weight: 0.3, criteria: 给出可在发布前快速执行的核心用例}
      - {dimension: 回滚, weight: 0.3, criteria: 触发条件、步骤和验证都可执行}
    difficulty: 3

  - id: EX-013-01
    type: single_choice
    concepts: [experiment-design]
    level: L2
    prompt: 估计机器人任务成功率所需样本量，主要取决于？
    options:
      - {id: a, text: 成功率的均值}
      - {id: b, text: 置信水平与允许误差}
      - {id: c, text: 代码总行数}
      - {id: d, text: 测试团队规模}
    answer: b
    explanation: 样本量由目标置信水平、允许误差和预期比例共同决定，不是团队规模。
    difficulty: 2

  - id: EX-013-02
    type: short_answer
    concepts: [experiment-design]
    level: L3
    prompt: 为“抓取成功率不低于 98%”设计一次实验，说明重复次数、置信区间、变异来源和控制方法。
    answer:
      accepted: ["样本量", "置信", "重复", "变异", "环境", "负载", "控制"]
      min_hits: 4
    rubric:
      - {dimension: 样本量, weight: 0.3, criteria: 给出与置信水平和允许误差匹配的样本量}
      - {dimension: 变异来源, weight: 0.4, criteria: 识别环境、负载、温度、传感器噪声或操作者}
      - {dimension: 控制, weight: 0.3, criteria: 说明随机化、分层或固定条件等控制手段}
    difficulty: 3

  - id: EX-014-01
    type: multi_choice
    concepts: [flakiness-baseline]
    level: L2
    prompt: 下列哪些是机器人测试 Flakiness 的常见来源？
    options:
      - {id: a, text: 时间与超时设置}
      - {id: b, text: 并发资源竞争}
      - {id: c, text: 环境与场地差异}
      - {id: d, text: 随机数与未固定种子}
      - {id: e, text: 网络抖动与丢包}
      - {id: f, text: 代码注释风格}
    answer: [a, b, c, d, e]
    explanation: 时间、并发、环境、随机性和网络都会造成不稳定；注释不会。
    difficulty: 2

  - id: EX-014-02
    type: self_assess
    concepts: [flakiness-baseline]
    level: L3
    prompt: 解释为什么机器人指标更常用 P95/P99 而不是均值，并举一个你熟悉的场景说明选择依据。
    rubric:
      - {dimension: 统计理解, weight: 0.4, criteria: 能说明均值掩盖长尾、P95/P99 反映尾部风险}
      - {dimension: 场景, weight: 0.4, criteria: 举出与安全或体验相关的具体机器人场景}
      - {dimension: 取舍, weight: 0.2, criteria: 说明均值仍适合什么情况}
    difficulty: 3

  - id: EX-014-03
    type: artifact
    concepts: [flakiness-baseline]
    level: L3
    prompt: 提交一份 Flakiness 趋势分析（图表或表格 + 结论），说明基线、异常点和改进建议。
    artifact:
      accept: [png, svg, md, csv, txt]
      max_size_mb: 10
    rubric:
