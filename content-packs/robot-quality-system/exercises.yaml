schema: tb/1
exercises:
- id: ex-1
  type: single_choice
  concepts:
  - test-strategy-risk
  level: L2
  prompt: 在基于风险的测试中，最常用的风险值计算方式是下列哪一项？
  options:
  - id: a
    text: 风险值 = 测试用例数量 × 覆盖率
  - id: b
    text: 风险值 = 可能性 × 影响
  - id: c
    text: 风险值 = 缺陷数 ÷ 代码行数
  - id: d
    text: 风险值 = 测试时长 × 自动化比例
  answer: b
  rubric: []
  hints: []
  difficulty: 2
  explanation: 风险分级流程中，风险值通常由可能性（probability）与影响（impact）相乘得到，即 R = P × I，再据此把风险划分为严重、高、中、低等等级，并映射到不同测试强度。其余选项描述的是覆盖率、缺陷密度和自动化投入，都不是风险值的定义。
- id: ex-2
  type: multi_choice
  concepts:
  - test-strategy-risk
  level: L3
  prompt: 某团队要为一台人形机器人制定基于风险的测试策略，但时间与台架资源有限。下列哪些做法符合风险驱动策略的原则？（多选）
  options:
  - id: a
    text: 按风险等级分配测试工作量，把大部分资源压到严重与高风险项上
  - id: b
    text: 因为急停回路的风险乘积值不高，把它排到低优先级，等有余量再测
  - id: c
    text: 对安全红线项（如碰撞力、急停响应）不参与乘积排序，直接全量验证
  - id: d
    text: 时间紧张时优先削减低风险项的测试深度，而不是削减高风险项的测试范围
  - id: e
    text: 只要覆盖率指标达标，就可以认为风险已被充分管理
  answer:
  - a
  - c
  - d
  rubric: []
  hints: []
  difficulty: 4
  explanation: a 体现了按等级分配资源的核心思想；c 体现了安全红线项需与乘积排序叠加，不能仅凭数值排序；d 体现了约束下的取舍原则——压缩低风险深度而非高风险范围。b
    错在把安全红线项交给乘积排序，急停失效虽数值不高但属单点即危险；e 错在以覆盖率替代风险判断，覆盖率达标不等于风险已被管理。
- id: ex-3
  type: short_answer
  concepts:
  - test-strategy-risk
  level: L3
  prompt: 某移动服务机器人项目列出了四项风险：①急停回路失效（可能性 2，影响 5）；②人机共域碰撞力超限（可能性 3，影响 5）；③导航路径规划错误（可能性
    4，影响 3）；④界面文案错别字（可能性 4，影响 1）。请计算各项风险值，给出测试优先级排序，并说明为什么不能只按风险值排序。
  options: []
  answer:
    accepted:
    - ①=10，②=15，③=12，④=4；优先级大致为②>③>①>④，但①作为安全红线项必须全量验证，实际应与②同级甚至更高
    - 风险值分别为10、15、12、4，排序②③①④，但急停属安全红线不能仅按数值排
    min_hits: 1
  rubric:
  - dimension: 风险值计算
    weight: 0.3
    criteria: 四项风险值均正确：10、15、12、4
  - dimension: 优先级排序
    weight: 0.3
    criteria: 给出基于风险值的排序（②>③>①>④）
  - dimension: 红线项识别
    weight: 0.4
    criteria: 指出急停回路属安全红线项，不能仅凭乘积排序，需全量验证或提升优先级
  hints: []
  difficulty: 4
  explanation: 按 R = P × I：①=2×5=10，②=3×5=15，③=4×3=12，④=4×1=4。纯数值排序为②>③>①>④。但急停回路失效属于“单点故障即可能导致危险”的安全红线项，其风险值虽只有
    10，却必须无条件全量验证，不能因为乘积不高就排到后面。这说明风险分级需要与标准强制项、安全红线叠加使用，而不是单一数值排序。
- id: ex-4
  type: self_assess
  concepts:
  - test-strategy-risk
  level: L3
  prompt: 请为你熟悉的一台机器人（或课程中的移动服务机器人）写出一份简版风险测试策略，至少包含：3 条风险项及其可能性/影响打分与风险值、风险等级划分、每个等级对应的测试强度、以及在时间受限时你会如何取舍。写完后对照下面的量规自评。
  options: []
  rubric:
  - dimension: 风险识别与量化
    weight: 0.3
    criteria: 至少列出 3 条具体风险项，给出可能性与影响打分并计算风险值，打分有依据
  - dimension: 等级划分与测试强度映射
    weight: 0.3
    criteria: 给出清晰的风险等级分段，并为每个等级规定可执行的测试类型/深度
  - dimension: 约束下的取舍
    weight: 0.2
    criteria: 说明时间或资源受限时削减什么、保留什么，并指出安全红线项不可压缩
  - dimension: 残留风险与复评
    weight: 0.2
    criteria: 提到残留风险的显式接受与复评触发条件（如模型、固件、运行设计域变化）
  hints: []
  difficulty: 5
  explanation: 本题检验你能否把风险分级流程完整落到一个具体对象上。合格答案应体现：风险值由可能性×影响得出；等级划分后映射到不同测试强度；资源受限时压缩低风险项而非高风险项；安全红线项单独处理；残留风险需显式接受并在变更时复评。若你的答案只列了风险项而没有映射到测试强度，或没有讨论取舍，说明还停留在
    L2 水平。
- id: ex-taskchain-model
  type: single_choice
  concepts:
  - test-design-taskchain
  level: L2
  prompt: 把机器人任务分解为任务链时，下列哪一项最不属于任务链建模必须显式记录的内容？
  options:
  - id: a
    text: 子任务节点之间的前置—后继依赖关系
  - id: b
    text: 每个节点结束时必须为真的状态断言（状态契约）
  - id: c
    text: 每个节点所用控制器的源代码行数与圈复杂度
  - id: d
    text: 失效后影响面较大的关键节点
  answer: c
  rubric: []
  hints: []
  difficulty: 2
  explanation: 任务链建模关注节点、依赖、状态契约与关键节点，属于行为与状态层面的抽象。控制器的代码规模与圈复杂度是白盒结构度量，既不描述任务链结构，也不能直接支撑链级测试设计，因此最不属于任务链建模的必要内容。
- id: ex-failure-propagation
  type: multi_choice
  concepts:
  - test-design-taskchain
  level: L3
  prompt: 某任务链为：导航到柜前 → 打开柜门 → 识别目标块 → 抓取 → 搬运 → 放置 → 校验。若要设计“失效传播与恢复”类测试，下列哪些做法是合理的？（多选）
  options:
  - id: a
    text: 在“识别目标块”之后重新藏起目标块，检验系统能否重新检测缺失并重复探索流程
  - id: b
    text: 在“搬运”阶段拆散已完成的部分结构，检验系统能否重估进度并重规划
  - id: c
    text: 只跑一次完整端到端流程，若成功即认为失效传播路径已被覆盖
  - id: d
    text: 给位姿估计注入 5%–10% 的相对噪声，检验感知误差是否向下游传播
  - id: e
    text: 在工作区加入干扰物，检验目标选择与任务相关推理是否稳健
  answer:
  - a
  - b
  - d
  - e
  rubric: []
  hints: []
  difficulty: 4
  explanation: 失效传播测试的核心是在链的中段注入扰动，观察系统能否识别异常状态、重规划并恢复。a、b、d、e 分别对应状态突变、进度破坏、感知噪声与干扰物四类注入，都是合理设计。c
    错误：端到端成功一次既不能证明失效路径被覆盖，也无法定位问题，端到端测试不能替代注入式测试。
- id: ex-risk-priority
  type: short_answer
  concepts:
  - test-strategy-risk
  level: L3
  prompt: 某任务链节点“打开柜门”的发生可能性评为 4（1–5 分），影响评为 5（1–5 分）；节点“放置”的可能性为 2、影响为 4。请计算两者的风险值，说明各自的风险等级归属思路，并指出在测试资源有限时应优先保障哪个节点的测试强度、为什么。
  options: []
  answer:
    accepted:
    - 打开柜门风险值20，放置风险值8，优先保障打开柜门
    - 20 与 8，优先测试打开柜门
    - 打开柜门 R=20 高于放置 R=8，应优先
    min_hits: 1
  rubric:
  - dimension: 风险值计算
    weight: 0.35
    criteria: 正确按 R=P×I 算出打开柜门为 20、放置为 8，并说明风险值用于排序与分级
  - dimension: 等级与策略对应
    weight: 0.35
    criteria: 指出高风险节点应采用多技术交叉与异常/恢复路径覆盖，中风险节点可覆盖主路径与主要备选分支
  - dimension: 优先级论证
    weight: 0.3
    criteria: 说明优先保障打开柜门的理由（风险值更高、且位于链上游、失效会向下游传播），并提到 P 与 I 应分开审视而非只看单一数字
  hints: []
  difficulty: 4
  explanation: 按 R=P×I，打开柜门为 4×5=20，放置为 2×4=8。20 明显高于 8，且打开柜门位于任务链上游、下游节点多，失效会沿依赖边传播，因此应优先保障其测试强度：采用节点级
    + 链级 + 扰动注入的多技术交叉，并覆盖异常与恢复路径。同时要注意“低概率高后果”的风险不能被乘积掩盖，P 与 I 应作为两个维度分别审视。
- id: ex-design-table
  type: self_assess
  concepts:
  - test-design-taskchain
  - test-strategy-risk
  level: L3
  prompt: 请为一条你熟悉的机器人任务链（例如“取物并放入容器”）完成一份测试设计表：至少列出 4 个节点或依赖边，为每项写出状态契约、关键性判断（是否位于上游/扇出大小）、P
    与 I 评分及风险等级，并为高等级项设计至少一条节点级用例和一条注入式用例。完成后按下列维度自评。
  options: []
  rubric:
  - dimension: 任务链结构完整性
    weight: 0.3
    criteria: 节点划分清晰、依赖顺序正确，每个节点都给出可判定的状态契约（而非“工作正常”这类模糊描述）
  - dimension: 关键节点识别
    weight: 0.25
    criteria: 依据下游可达节点数或扇出而非主观复杂度识别关键节点，并说明失效会如何沿依赖边传播
  - dimension: 风险分级合理性
    weight: 0.25
    criteria: P 与 I 分别评分并给出 R=P×I，等级划分有判据，且测试深度与等级对应（高等级多技术交叉、低等级冒烟）
  - dimension: 用例可执行性
    weight: 0.2
    criteria: 节点级用例与注入式用例均可执行、可判定，注入方式具体（如位姿噪声比例、干扰物类型、状态突变时机）
  hints: []
  difficulty: 5
  explanation: 一份合格的测试设计表应把任务链建模与风险分级真正接起来：结构侧保证节点、依赖与状态契约可判定，风险侧保证测试深度与风险等级匹配。常见失分点是状态契约写得不可判定、关键节点按“看起来复杂”而非按下游影响面判断，以及只设计正常路径而缺少注入式用例。
- id: ex-oracle-type
  type: single_choice
  concepts:
  - oracle-metrics
  level: L2
  prompt: 某 VLA 机器人需要完成“把红色方块放进盒子”的任务。团队无法为每条指令写出精确期望输出，于是改为定义“对图像做轻微亮度变化后，机器人的动作轨迹应保持基本一致”这类规则来判定。这种做法最准确地属于哪一类测试预言？
  options:
  - id: A
    text: 精确期望值预言：用仿真真值给出每一步的期望关节角
  - id: B
    text: 蜕变关系预言：描述输入变化与输出变化之间应满足的关系
  - id: C
    text: 状态码预言：检查接口返回是否 5xx
  - id: D
    text: 差分预言：对比两个模型版本的输出是否完全相等
  answer: B
  rubric: []
  hints: []
  difficulty: 2
  explanation: 蜕变测试的核心思想是构造蜕变关系，描述测试输入的变化与输出变化的关系与规律，从而在缺乏精确期望输出的情况下判定。题干中“输入亮度变化
    → 轨迹应基本一致”正是典型的蜕变关系。A 需要精确标签，C 是 Web 接口场景，D 是差分测试且要求完全相等过于严格。
- id: ex-metric-design
  type: multi_choice
  concepts:
  - oracle-metrics
  level: L3
  prompt: 你要为一个“机械臂抓取并放置工件”的测试设计量化指标体系。下列哪些做法符合本课强调的指标设计原则？（多选）
  options:
  - id: A
    text: 用“位置误差 ≤ ε 且姿态角误差 ≤ δ”代替“位姿完全相等”来判定放置到位
  - id: B
    text: 把关节速度/扭矩超限、非预期碰撞作为硬性安全约束单独判定
  - id: C
    text: 只保留一个综合总分，不再区分完成度、过程质量、安全与效率
  - id: D
    text: 指标选取兼顾全面性、易测性与科学性，并说明每个指标的数据来源
  - id: E
    text: 为了显得严格，把所有阈值都设为 0，要求零误差
  answer:
  - A
  - B
  - D
  rubric: []
  hints: []
  difficulty: 3
  explanation: A 体现“用容差代替相等”，与用 IoU 阈值替代严格相等是同一思路；B 体现安全约束应作为确定性硬规则；D 对应工业机器人评价标准提出的全面性、易测性、科学性原则。C
    把多维质量压缩成单一分数会丢失诊断信息；E 的零误差阈值在存在测量噪声与预测漂移时必然导致大量误报，不可取。
- id: ex-taskchain-oracle
  type: short_answer
  concepts:
  - test-design-taskchain
  - oracle-metrics
  level: L3
  prompt: 请为一个“移动底盘 + 机械臂”协作搬运任务建模任务链，并说明预言与指标如何挂载。要求：(1) 至少拆出 3 个子任务并给出可检查的子目标谓词；(2)
    说明局部预言与全局预言各自负责什么；(3) 为至少 2 个子任务各给出 1 个量化指标及其阈值设定依据。
  options: []
  answer:
    accepted:
    - 子任务拆分：导航到工件旁、抓取工件、搬运到目标区、放置到位
    - 子目标谓词：at(robot, near(workpiece))、is_grasped(workpiece)、In(workpiece, target_zone)
    - 局部预言检查本环节动作后果是否与子任务目标一致
    - 全局预言检查环节间时序与协作逻辑，如底盘就位后机械臂才抬升
    - 指标示例：抓取成功率阈值依据历史基线；放置位置误差阈值依据任务公差
    - 安全约束作为硬规则单独判定，如碰撞与关节超限
    min_hits: 3
  rubric:
  - dimension: 任务链拆分与谓词
    weight: 0.35
    criteria: 拆出至少 3 个有先后依赖的子任务，每个子任务给出可检查、可判定的子目标谓词，而非笼统描述
  - dimension: 预言分层
    weight: 0.35
    criteria: 清楚区分局部预言（单环节动作后果）与全局预言（时序/协作/整体目标），并说明二者如何融合成最终判决
  - dimension: 指标与阈值依据
    weight: 0.3
    criteria: 至少 2 个子任务各给出量化指标，且说明阈值来源（标准、历史基线、任务公差或数据分布），并提及安全约束的硬性判定
  hints: []
  difficulty: 4
  explanation: 任务链建模的关键是把“整体任务”拆成带谓词的子任务，让预言有可挂载的位置。局部预言关注单智能体动作的直接后果，全局预言关注并发、时序依赖与整体目标达成。指标必须可测量并说明阈值来源，安全类约束应作为确定性硬规则，不参与“平均分”。
- id: ex-threshold-review
  type: self_assess
  concepts:
  - oracle-metrics
  - test-design-taskchain
  level: L3
  prompt: 请审视你自己（或你熟悉的一个机器人项目）的一组测试指标，逐条回答：该指标的阈值来自哪里？阈值放宽/收紧一档时通过率是否剧烈变化？误报与漏报的代价是否对称？该指标挂在任务链的哪个环节？写完后对照下方量规自评。
  options: []
  rubric:
  - dimension: 阈值来源可追溯
    weight: 0.3
    criteria: 每个指标都能说明阈值来自标准、合同、历史基线、物理约束或数据分布，而不是凭感觉设定
  - dimension: 敏感性分析
    weight: 0.25
    criteria: 至少对一个指标做了阈值敏感性讨论，识别出阈值是否落在分布陡峭处、判定是否稳定
  - dimension: 误报漏报权衡
    weight: 0.25
    criteria: 区分误报与漏报的代价，并对安全相关指标采取保守取向
  - dimension: 任务链挂载
    weight: 0.2
    criteria: 能指出每个指标对应任务链的哪个子任务/环节，避免指标与环节脱节
  hints: []
  difficulty: 3
  explanation: 阈值合理性不是数学问题而是工程判断问题：来源决定可信度，敏感性决定稳定性，代价对称性决定保守程度，任务链挂载决定指标是否真的在测你想测的东西。四项都答得上，说明指标设计可辩护。
- id: L-001-004-ex-1
  type: single_choice
  concepts:
  - defect-rootcause
  level: L2
  prompt: 某移动机器人出现“直线行驶时持续向右偏”的现象。团队按发生位置把该缺陷归到“控制层”，随后直接修改了控制器增益，但问题依旧。按照本课的分类思路，下列哪种做法最恰当？
  options:
  - id: a
    text: 继续在控制层调参，直到跑偏消失为止
  - id: b
    text: 把缺陷重新按根因维度分类（如标定配置错误、地面打滑等环境因素、驱动器件漂移），并设计实验逐项排除
  - id: c
    text: 把该缺陷标记为“技术局限”，不再处理
  - id: d
    text: 直接更换控制器硬件
  answer: b
  rubric: []
  hints: []
  difficulty: 2
  explanation: 按位置分类只能圈定排查范围，不能指向根因。跑偏的根因可能是配置（里程计标定参数）、环境（地面打滑）或器件（电流采样漂移），必须按根因维度重新分类并用实验逐项排除。盲目调参属于“找到一个说得过去的解释”，不是根因分析。
- id: L-001-004-ex-2
  type: multi_choice
  concepts:
  - defect-rootcause
  level: L3
  prompt: 你要在实验室复现一个“现场偶发、每天出现一两次”的机器人导航异常。为了让复现可控，下列哪些条件属于必须固定或记录的内容？
  options:
  - id: a
    text: 软件版本、参数配置与标定文件
  - id: b
    text: 地面材质、光照、温度等环境条件
  - id: c
    text: 任务指令序列与感知输入的录制数据
  - id: d
    text: 启动顺序、通信周期与并发任务的相对时序
  - id: e
    text: 只记录最终失败的那一帧截图即可
  answer:
  - a
  - b
  - c
  - d
  rubric: []
  hints: []
  difficulty: 3
  explanation: 复现需要固定环境条件、系统状态、输入序列与时序条件四类要素。仅保留失败瞬间的截图无法重建因果链，也无法验证根因是否找对。日志回放与仿真回放正是为了把这四类条件固化下来。
- id: L-001-004-ex-3
  type: short_answer
  concepts:
  - oracle-metrics
  level: L3
  prompt: 某团队测试机械臂抓取放置任务，发现注入“目标点超出工作空间”这一故障后，所有强度下的任务成功率都是 0%，无法区分轻度与重度故障的影响。请说明问题出在哪里，并给出改进方案（至少包含一个替代指标与一个可用的测试预言形式）。
  options: []
  answer:
    accepted:
    - 成功率饱和
    - 二值预言饱和
    - 改用连续指标
    - 末端定位误差
    - 放置误差
    - 欧氏距离
    - 不变量
    - 蜕变
    - 差分
    - 规格预言
    - 连续度量
    min_hits: 2
  rubric:
  - dimension: 问题诊断
    weight: 0.4
    criteria: 指出二值成功率在该故障下饱和（全为 0），失去区分度，无法量化退化程度
  - dimension: 替代指标
    weight: 0.35
    criteria: 提出连续指标，如末端/放置位置与目标点的欧氏距离、轨迹偏差、重复定位离散度等
  - dimension: 测试预言
    weight: 0.25
    criteria: 给出合适的预言形式，如规格预言（与目标位姿比对容差）、不变量/蜕变预言或差分预言，并说明其判定逻辑
  hints: []
  difficulty: 4
  explanation: 当二值结果在某个故障强度区间饱和时，它就不再携带信息。应改用连续度量（如最终放置误差的欧氏距离）来刻画不同强度下的退化曲线；同时把判定机制从“成功/失败”升级为规格预言（误差是否在容差内）或不变量/蜕变预言（如目标整体平移后轨迹形状应基本不变），从而获得细粒度的判定能力。
- id: L-001-004-ex-4
  type: self_assess
  concepts:
  - defect-rootcause
  - oracle-metrics
  level: L3
  prompt: 请针对一个你熟悉的机器人缺陷（真实或假设），完成一份根因分析小结，包含：(1) 缺陷现象与按根因维度的分类；(2) 复现所需的四类条件；(3)
    使用的根因分析方法（5 Why / 鱼骨图 / 帕累托 / FMEA / 因果干预中的至少两种）及推理链；(4) 用于判定缺陷存在与否的测试预言与至少一个量化指标；(5)
    遏制、纠正、预防三层措施，并说明如何用同一套预言与指标验证措施有效。写完后对照下方评分标准自评。
  options: []
  rubric:
  - dimension: 分类与复现
    weight: 0.25
    criteria: 现象描述具体；按根因维度（设计/制造/环境/操作/配置/技术局限）分类合理；复现条件覆盖环境、系统状态、输入序列、时序四类
  - dimension: 根因推理
    weight: 0.3
    criteria: 使用至少两种方法且用法正确（如鱼骨图用于穷举、5 Why 用于纵深、帕累托用于筛选主因、干预实验用于确认因果）；每一层追问有证据支撑；明确区分根因与症状
  - dimension: 预言与指标
    weight: 0.25
    criteria: 测试预言形式与预期缺陷类型匹配（崩溃类 vs 结果错误类）；量化指标可测量、有阈值或基线；说明为何该指标能反映该根因
  - dimension: 措施与验证
    weight: 0.2
    criteria: 三层措施区分清晰，预防措施针对真因且落到流程或设计；给出用相同预言与指标在相同复现条件下重跑并做回归的验证方案
  hints: []
  difficulty: 4
  explanation: 本题检验从“说清缺陷”到“查到底”再到“改到位”的完整闭环。高质量答案的特征是：分类服务于排查方向、复现条件可固化、根因有证据链且经过干预验证、预言与指标能区分不同根因、预防措施改变了流程而非只修个案。
- id: ex-coverage-gate-design
  type: single_choice
  concepts:
  - coverage-release-gate
  level: L2
  prompt: 某机器人团队要给一个已有三年历史的导航模块（当前行覆盖率 55%）引入覆盖率门禁。下列哪种设计最可能在半年后仍然有效？
  options:
  - id: A
    text: 统一要求所有模块行覆盖率不低于 85%，不达标即阻断发布
  - id: B
    text: 对遗留模块先设“不得下降”（允许下降 0.0%）并保留 55% 的绝对下限，同时为新模块设 85% 绝对阈值，按模块逐步抬高
  - id: C
    text: 只统计全组织平均覆盖率，平均值达标即放行
  - id: D
    text: 覆盖率报告缺失时默认视为通过，避免流水线误报
  answer: B
  rubric: []
  hints: []
  difficulty: 2
  explanation: 遗留系统直接上 80%+ 的绝对线，通常导致团队关闭门禁并遗忘。可行做法是基线与变化量双控：遗留模块先守“不得下降”，新模块守绝对阈值，再按模块逐步抬高。选项
    C 的平均值会被易覆盖模块稀释，掩盖关键路径空白；选项 D 把“没有数据”误当成“数据很好”，是门禁最常见的漏洞。
- id: ex-gate-rules-multi
  type: multi_choice
  concepts:
  - coverage-release-gate
  level: L3
  prompt: 你正在为一个机器人控制软件的版本准入准则编写门禁规则。下列哪些应当作为“阻断发布”的条件？（多选）
  options:
  - id: A
    text: 本次提交的总体覆盖率仍高于阈值，但相对上一基线下降幅度超过容忍度
  - id: B
    text: 覆盖率报告未上传，流水线中该检查项无数据
  - id: C
    text: 某个临时降低标准的例外已过到期日，但配置中仍保留
  - id: D
    text: 新增了一个安全相关测试用例，覆盖率上升
  - id: E
    text: 关键回归用例出现失败
  answer:
  - A
  - B
  - C
  - E
  rubric: []
  hints: []
  difficulty: 4
  explanation: A 是变化量失控，说明质量在静默退化；B 属于“无数据不得视为通过”，必须阻断而不是自动跳过；C 的过期例外等同于门禁失效；E 是关键回归失败，属于最基本的阻断条件。D
    是覆盖率改善，属于允许通过的情形，不需要阻断。设计门禁时要同时覆盖绝对阈值、变化量、数据缺失与例外时效四类情形。
- id: ex-admission-decision
  type: short_answer
  concepts:
  - coverage-release-gate
  level: L3
  prompt: 某机器人版本准备从预发进入生产。证据如下：核心运动控制模块行覆盖率 88%（阈值 85%，上一基线 90%，允许下降 0.5%）；场景覆盖率报告显示“湿滑地面
    + 斜坡”场景未覆盖，而该场景在上个版本曾导致一次打滑事故；安全相关回归用例全部通过；有一个降低标准的例外，责任人与原因已填，到期日为上周。请给出准入结论，并说明你的判断依据与需要补充的动作。
  options: []
  answer:
    accepted:
    - 不准予放行
    - 不准入
    - 阻断发布
    - 拒绝放行
    - 不放行
    - NO-GO
    - no-go
    min_hits: 1
  rubric:
  - dimension: 结论明确
    weight: 0.2
    criteria: 明确给出阻断/不准予放行的结论，而非模糊表述
  - dimension: 变化量识别
    weight: 0.25
    criteria: 指出覆盖率从 90% 降到 88%，下降 2 个百分点，超过 0.5% 的容忍度，构成变化量失控
  - dimension: 高风险未覆盖场景
    weight: 0.3
    criteria: 指出“湿滑地面+斜坡”属于曾引发事故的高风险场景，未覆盖不能放行，需补测或做风险接受记录
  - dimension: 例外时效
    weight: 0.25
    criteria: 指出例外已过期，等同于门禁失效，必须先关闭或重新审批
  hints: []
  difficulty: 5
  explanation: 这是一个典型的“总分看起来还行、证据链却不闭合”的案例。虽然 88% 高于 85% 的绝对阈值，但相对基线下降 2 个百分点，远超 0.5%
    的容忍度；同时未覆盖场景恰好落在曾发生事故的高风险区，属于不可接受的风险暴露；过期例外使门禁事实上失效。正确做法是阻断放行，补齐高风险场景测试、关闭或重新审批例外，并在下一基线重新评估。注意：安全回归全通过只能说明已测部分没问题，不能覆盖未测场景。
- id: ex-design-1
  type: multi_choice
  concepts:
  - experiment-statistics
  level: L2
  prompt: 你要比较两个抓取策略的成功率。下列哪些做法符合良好的实验设计原则？（多选）
  options:
  - id: a
    text: 为每个策略设定相同的 rollout 次数，并在实验前锁定样本量
  - id: b
    text: 随机化两个策略的试验顺序，避免电量与温度漂移与策略混淆
  - id: c
    text: 在相同初始物体位姿上分别运行两个策略，形成配对比较
  - id: d
    text: 先跑 20 次，看到新策略更好就停止实验并宣布改进
  - id: e
    text: 只测试表现最好的那个场景，以减少试验成本
  answer:
  - a
  - b
  - c
  rubric: []
  hints: []
  difficulty: 2
  explanation: A、B、C 分别对应预注册样本量、随机化与配对/区组设计，都能降低偏倚与方差。D 属于可选停止导致的偏倚，E 会破坏覆盖代表性，二者都会让结论不可信。
- id: ex-ci-2
  type: single_choice
  concepts:
  - experiment-statistics
  level: L3
  prompt: 某策略在 40 次 rollout 中成功 36 次（点估计 90%）。同事说“另一个策略 92%，所以新策略更好”。下列判断最恰当的是？
  options:
  - id: a
    text: 92% 大于 90%，差异真实存在，可以直接采纳
  - id: b
    text: 40 次试验的 95% 置信区间很宽，两个策略的区间很可能重叠，2 个百分点差异不足以支撑结论
  - id: c
    text: 只要 p 值小于 0.05 就说明效应在工程上重要
  - id: d
    text: 应该用正态近似算区间，因为样本量已经足够大
  answer: b
  rubric: []
  hints: []
  difficulty: 3
  explanation: 小样本下成功率区间很宽，2 个百分点的差距远小于估计不确定性，不能据此判定优劣；需要更多试验或配对设计。p 值小也不等于效应重要；正态近似在小样本、接近边界时不可靠。
- id: ex-gate-3
  type: short_answer
  concepts:
  - coverage-release-gate
  - experiment-statistics
  level: L3
  prompt: 请为一个机器人抓取功能的版本发布写一条准入规则，要求同时体现覆盖率要求与统计判据，并说明未达样本量时如何处理。
  options: []
  answer:
    accepted:
    - 置信下界
    - 置信区间下界
    - lower bound
    - 覆盖率
    - 样本量
    - 未决
    - 不放行
    - 风险分级
    min_hits: 3
  rubric:
  - dimension: 覆盖率要求
    weight: 0.35
    criteria: 明确高风险路径的覆盖要求（如关键场景全覆盖或按风险分级设定覆盖深度）
  - dimension: 统计判据
    weight: 0.4
    criteria: 使用置信下界或区间而非仅点估计作为门槛，并规定显著性水平或最小可检测差异
  - dimension: 未达样本量的处理
    weight: 0.25
    criteria: 说明样本量不足时结论记为未决、不得放行，并记录偏离计划的改动
  hints: []
  difficulty: 4
  explanation: 好的准入规则把覆盖广度与统计可信度结合：高风险模块要求更高覆盖深度，指标以置信下界达标为准，样本量不足时不得以点估计放行。
- id: ex-reflect-4
  type: self_assess
  concepts:
  - experiment-statistics
  - coverage-release-gate
  level: L3
  prompt: 回顾你最近一次机器人测试：请写出实验的因子与水平、每个条件的重复次数、使用的区间或检验方法，以及你据以下结论的准入判据。然后自评哪些环节还缺少统计支撑。
  options: []
  rubric:
  - dimension: 设计要素完整
    weight: 0.35
    criteria: 清楚写出因子、水平、重复次数与随机化/配对安排
  - dimension: 推断方法恰当
    weight: 0.35
    criteria: 说明了区间或检验方法，并解释显著性与效应量的区别
  - dimension: 准入判据可执行
    weight: 0.3
    criteria: 给出可审计的发布判据，包含覆盖率与统计门槛，并指出改进点
  hints: []
  difficulty: 3
  explanation: 自评重点在于把隐性的“凭感觉下结论”显性化为可复现的设计与判据；若缺少样本量规划或区间报告，就是需要补强的环节。
- id: ex-map-clause
  type: single_choice
  concepts:
  - standards-compliance
  level: L2
  prompt: 某协作机器人应用需要证明“功率与力限制”满足要求。按照合规矩阵的写法，下列哪一组映射最完整、最可核查？
  options:
  - id: a
    text: 标准与版本 + 条款号 + 主题 + 实现位置 + 验证方式 + 证据工件 + 责任人
  - id: b
    text: 只写标准名称与“已满足”结论
  - id: c
    text: 只写测试用例编号，不写条款
  - id: d
    text: 只写实现代码路径，不写验证方式
  answer: a
  rubric: []
  hints: []
  difficulty: 2
  explanation: 合规矩阵的价值在于把条款、实现与证据三者连成可核查的链条。只写结论或只写一端（条款或实现）都无法回答“这条要求凭什么算满足、由谁负责”。标准版本必须记录，因为证据若回答的是被取代的旧版本，在审核方眼中等同于没有证据。
- id: ex-gap-identify
  type: multi_choice
  concepts:
  - standards-compliance
  level: L3
  prompt: 以下哪些属于典型的“合规证据缺口”（工作可能已完成，但无法证明）？选出所有符合的项。
  options:
  - id: a
    text: 合规矩阵某行写了验证方式为“测试”，但对应的测试报告从未产出
  - id: b
    text: 一份测试报告被同时引用到两个标准的重叠要求上，但只实际覆盖了其中一条
  - id: c
    text: 证据回答的是标准旧版本，而审核方按当前接受的版本审查
  - id: d
    text: 测试全部通过，且原始数据、分析脚本、判定规则与结论齐备并绑定到设计基线
  answer:
  - a
  - b
  - c
  rubric: []
  hints: []
  difficulty: 3
  explanation: A 是“纸面有方法、背后无工件”；B 是共享证据被重复记账，实际漏掉一条要求；C 是版本歧义，旧版本证据在新版本口径下读作无证据。D
    恰恰是证据完备的状态：数据、分析、判定规则与结论齐全，并绑定到它所认证的配置基线。
- id: ex-stats-limit
  type: short_answer
  concepts:
  - experiment-statistics
  level: L3
  prompt: 团队要证明某协作机器人在人体接触场景下的碰撞力低于规定限值。请写出你的实验设计与统计判定方案要点，并说明为什么“多测几次取平均”不能解决系统测量不确定度带来的问题。
  options: []
  answer:
    accepted:
    - 预先定义限值、置信水平、样本量与失败判据
    - 区分随机不确定度与系统不确定度
    - 系统不确定度需靠校准制度约束，平均不能消除
    - 记录原始数据、分析脚本、判定规则与结论并绑定基线
    - 覆盖最不利工况与人体部位分组
    min_hits: 3
  rubric:
  - dimension: 判定规则前置
    weight: 0.3
    criteria: 在采集数据前明确限值、置信水平、样本量与失败判据，避免事后挑选
  - dimension: 不确定度分析
    weight: 0.4
    criteria: 区分随机与系统不确定度，指出可分辨的最小偏差由不共有的系统不确定度决定，平均无法消除，需靠校准约束
  - dimension: 证据完整性
    weight: 0.3
    criteria: 说明原始数据、分析脚本、判定规则与结论需一并归档并绑定到设计基线
  hints: []
  difficulty: 4
  explanation: 合规结论多为统计结论，必须先定判定规则再采数据。比较观测值与密封参考值时，可分辨的最小偏差由两者不共有的那部分系统测量不确定度决定，增加平均次数只能压低随机分量，无法消除系统分量，只能通过校准制度约束。证据工件需包含原始数据、分析脚本、判定规则与结论，并绑定到它所认证的配置。
- id: ex-evidence-plan
  type: self_assess
  concepts:
  - standards-compliance
  - experiment-statistics
  level: L3
  prompt: 针对你所在项目的一条安全要求（例如速度与分离监控），写出一份证据补齐计划：说明当前证据状态、缺口类型、补齐路径（补做测试/改用分析或检查/引用供应商证据）、优先级理由，以及补齐后如何用统计判定支撑结论。请对照评分标准自评。
  options: []
  rubric:
  - dimension: 缺口定位
    weight: 0.3
    criteria: 准确指出缺口属于链条断裂、版本歧义、责任分散还是重建文化，并定位到具体条款与工件
  - dimension: 路径选择
    weight: 0.3
    criteria: 补齐路径与认证基础接受的方法一致，说明为何不选其他路径，并记录决策
  - dimension: 优先级
    weight: 0.2
    criteria: 按阻塞下游工作量排序，先补阻塞多项后续活动的缺口
  - dimension: 统计支撑
    weight: 0.2
    criteria: 补齐后的验证包含前置判定规则、不确定度处理与完整证据工件
  hints: []
  difficulty: 4
  explanation: 证据补齐不是简单“再测一遍”。先判定缺口类型，再选择认证基础接受的方法，按阻塞下游工作量排序，最后确保补齐后的验证在统计上站得住：判定规则前置、不确定度可解释、证据工件完整并绑定基线。
- id: L-002-004-ex-1
  type: single_choice
  concepts:
  - coverage-release-gate
  level: L3
  prompt: 某 AMR 软件版本发布评审数据如下：总体行覆盖率 82%，工具类模块分支覆盖率 95%，但导航避障核心模块分支覆盖率仅 61%，且该模块有一个已知严重缺陷尚未关闭。按照本课的版本准入模型，最合理的结论是：
  options:
  - id: A
    text: 总体覆盖率 82% 已超过 80% 门槛，可以 GO
  - id: B
    text: 总体覆盖率达标但核心模块覆盖不足且存在未关闭严重缺陷，应 NO-GO 或有条件 GO 并明确关闭条件
  - id: C
    text: 只要工具类模块覆盖率高，核心模块可以豁免
  - id: D
    text: 覆盖率与准入无关，应只看缺陷数量
  answer: B
  rubric: []
  hints: []
  difficulty: 3
  explanation: 覆盖率是准入的必要条件而非充分条件。总体覆盖率会被大而简单的模块稀释，必须按模块、按风险看覆盖深度；安全相关或高风险模块的关键分支未覆盖、已知严重缺陷未关闭属于硬门槛（一票否决），不能因总体数字漂亮而豁免。因此应
    NO-GO，或采用“有条件 GO”并明确遗留风险的接受人、关闭时间与复评机制。
- id: L-002-004-ex-2
  type: multi_choice
  concepts:
  - standards-compliance
  level: L3
  prompt: 你负责为一款协作机器人软件准备合规证据包，客户要求参考机器人行业质量成熟度评价与 CR 认证要求进行供应商准入审核。下列哪些做法符合“要求—证据—结论”的合规评估原则？（多选）
  options:
  - id: A
    text: 建立适用标准清单，逐条映射到具体测试报告、认证证书与内审记录，并标注版本与日期
  - id: B
    text: 只要产品通过了安全与电磁兼容测试，就认为满足全部合规要求
  - id: C
    text: 对缺失证据的条款按内审三段式（判据—事实—结论）记录为不符合项，并制定整改计划
  - id: D
    text: 把合规视为一次性项目，取证后不再随版本更新复评
  - id: E
    text: 关注认证与准入规则的动态变化，软硬件重大改版后重新评估是否需要补充证据
  answer:
  - A
  - C
  - E
  rubric: []
  hints: []
  difficulty: 4
  explanation: 合规评估的核心是证据链：每条要求都要有可追溯、版本最新的证据（A 正确）；证据缺失即不符合，应按判据—事实—结论规范记录并整改（C 正确）；认证与准入规则会变化，重大改版后需重新评估（E
    正确）。B 把基础安全与 EMC 等同于全部合规，忽略了功能安全、可靠性、信息安全与质量体系成熟度等多维要求；D 把合规当成一次性项目，违背持续合规原则。
- id: L-002-004-ex-3
  type: short_answer
  concepts:
  - experiment-statistics
  level: L3
  prompt: 团队对新版本导航软件做了可靠性对比试验：旧版本 5 台样机累计 2000 小时出现 4 次故障，新版本 5 台样机累计 2000 小时出现 2
    次故障。研发据此宣称“新版本 MTBF 提升一倍，达到准入线”。请指出该结论至少两个统计上的问题，并说明你会如何补充分析以支撑准入决策。
  options: []
  answer:
    accepted:
    - 样本量小，未做假设检验或置信区间，点估计不足以支撑结论
    - 未报告置信区间，不确定性大
    - 未说明检验方法与显著性水平
    - 故障计数数据应使用比例检验或泊松/指数模型等方法
    - 未考虑试验条件一致性与删失数据
    - 未报告效应量与置信下限是否达到准入线
    - 存在选择性报告或多重比较风险
    min_hits: 2
  rubric:
  - dimension: 识别统计缺陷
    weight: 0.5
    criteria: 至少指出两个实质性问题，如样本量小、缺少假设检验/置信区间、未说明检验方法、未考虑删失或试验条件一致性等
  - dimension: 补充分析方案
    weight: 0.3
    criteria: 提出可执行的补充分析，如对故障率做比例检验或可靠性模型分析、报告置信区间与置信下限、明确显著性水平与样本量依据
  - dimension: 与准入决策挂钩
    weight: 0.2
    criteria: 说明统计结论应如何用于判断是否达到准入线，例如以置信下限对比门槛，而非仅用点估计
  hints: []
  difficulty: 4
  explanation: 2000 小时出现 4 次与 2 次故障，样本量与事件数都很小，点估计的波动极大。正确做法是明确假设（如新旧故障率是否相同）、选择合适的检验方法（比例检验或可靠性统计模型）、报告效应量与置信区间，并以置信下限与准入线比较。只有这样才能把“看起来变好”转化为可辩护的准入证据。
- id: L-002-004-ex-4
  type: self_assess
  concepts:
  - coverage-release-gate
  - standards-compliance
  - experiment-statistics
  level: L3
  prompt: 综合演练：请为一个即将交付客户的机器人软件版本撰写一页准入评审结论，需同时覆盖（1）分模块覆盖率与风险分级的判断；（2）适用标准与合规证据的符合性结论；（3）关键指标的统计证据与不确定性；（4）最终
    GO / 有条件 GO / NO-GO 决策及遗留风险的处理安排。写完后对照下方量规自评。
  options: []
  rubric:
  - dimension: 覆盖率与风险分级
    weight: 0.25
    criteria: 按模块与风险等级呈现覆盖率，识别硬门槛项（关键分支未覆盖、严重缺陷未关闭），不只引用总体数字
  - dimension: 合规证据链
    weight: 0.25
    criteria: 列出适用标准与认证要求，逐条映射证据并标注版本日期，对缺失项按判据—事实—结论记录不符合
  - dimension: 统计证据
    weight: 0.25
    criteria: 对关键指标给出检验方法、效应量与置信区间，说明结论的不确定性及其对准入门槛的含义
  - dimension: 决策与改进
    weight: 0.25
    criteria: 给出明确的 GO/有条件 GO/NO-GO 结论，列明遗留风险、接受人、关闭时间与复评机制，改进建议可执行
  hints: []
  difficulty: 5
  explanation: 本题检验三类证据的整合能力。高质量答案会把覆盖率作为测试充分性证据、把标准映射作为合规证据、把统计推断作为指标达标的证据，并在决策中显式记录被接受的风险。任何一块缺失或只给结论不给依据，都应在自评中扣分。
