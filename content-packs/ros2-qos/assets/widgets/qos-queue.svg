<svg viewBox="0 0 480 175" xmlns="http://www.w3.org/2000/svg">
  <text x="16" y="24" font-size="13" fill="#374151">发布端：消息按固定间隔到达</text>
  <g fill="#2563eb">
    <rect x="16" y="34" width="18" height="18" rx="3"/>
    <rect x="71" y="34" width="18" height="18" rx="3"/>
    <rect x="126" y="34" width="18" height="18" rx="3"/>
    <rect x="181" y="34" width="18" height="18" rx="3"/>
    <rect x="236" y="34" width="18" height="18" rx="3"/>
    <rect x="291" y="34" width="18" height="18" rx="3"/>
    <rect x="346" y="34" width="18" height="18" rx="3"/>
    <rect x="401" y="34" width="18" height="18" rx="3"/>
  </g>
  <text x="16" y="92" font-size="13" fill="#374151">订阅端：每隔 {{drain}} 倍间隔消费一次</text>
  <g transform="scale({{drain}}, 1)" fill="#dc2626">
    <polygon points="60,102 78,102 69,118"/>
    <polygon points="170,102 188,102 179,118"/>
    <polygon points="280,102 298,102 289,118"/>
    <polygon points="390,102 408,102 399,118"/>
  </g>
  <line x1="16" y1="140" x2="464" y2="140" stroke="#d1d5db"/>
  <text x="16" y="162" font-size="12" fill="#6b7280">drain={{drain}}x · 两个红色标记之间的蓝色方块数，就是这段时间的积压量。</text>
</svg>
