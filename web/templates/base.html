<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TestBridge{% endblock %}</title>
  <link rel="stylesheet" href="/static/tb.css">
</head>
<body data-lesson-id="{% block lesson_id %}{% endblock %}">
  {% set path = request.url.path %}
  {% set on_evolution = path.startswith("/studio/evolution") or "/history/" in path %}
  <a class="tb-skip-link" href="#tb-main">跳到主要内容</a>
  <header class="tb-top">
    <a href="/" class="tb-brand">TestBridge</a>
    <nav class="tb-nav" aria-label="主导航"><a href="/"{% if path == "/" or path.startswith("/lesson/") %} aria-current="page"{% endif %}>课程</a><a href="/today"{% if path.startswith("/today") %} aria-current="page"{% endif %}>今日</a><a href="/concepts"{% if path.startswith("/concepts") %} aria-current="page"{% endif %}>概念</a><a href="/review"{% if path.startswith("/review") %} aria-current="page"{% endif %}>复习</a><a href="/progress"{% if path.startswith("/progress") %} aria-current="page"{% endif %}>进度</a>{% if interview_available() %}<a href="/interview"{% if path.startswith("/interview") %} aria-current="page"{% endif %}>面试</a>{% endif %}<a href="/target"{% if path.startswith("/target") %} aria-current="page"{% endif %}>目标</a><a href="/applications"{% if path.startswith("/applications") %} aria-current="page"{% endif %}>求职</a><a href="/studio"{% if path.startswith("/studio") and not on_evolution %} aria-current="page"{% endif %}>工作台</a><a href="/studio/evolution"{% if on_evolution %} aria-current="page"{% endif %}>演进</a></nav>
  </header>
  <main class="tb-main {% block main_class %}{% endblock %}" id="tb-main">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
