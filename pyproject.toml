[project]
name = "testbridge"
version = "0.1.0"
description = "Content-agnostic teaching engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "nh3>=0.2.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "fsrs>=6.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
tb = "testbridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
