<article class="tb-lesson">
  <h1>固定偏移、漂移与抖动</h1>
  <section>
    <p>固定偏移通常来自时钟源不同或打点位置不同；漂移来自两个时钟频率不完全一致；抖动来自调度、传输或中断的短时不确定性。</p>
    <p>面试里常被追问：“你怎么判断是偏移还是漂移？”答案是看误差随时间的走势，而不是看单次差值。</p>
